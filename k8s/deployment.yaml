apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-model
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-model
  template:
    metadata:
      labels:
        app: heart-model
    spec:
      containers:
        - name: heart-model
          image: heart-disease-mlops:latest
          ports:
            - containerPort: 8000
